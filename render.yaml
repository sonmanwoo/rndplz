services:
  - type: web
    name: rndplz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py rndplz.public_web:application
    healthCheckPath: /healthz
    envVars:
      - key: RNDPLZ_SESSION_SECRET
        generateValue: true
      - key: RNDPLZ_PUBLISH_PERSONAL
        value: "1"
      - key: RNDPLZ_BRIDGE_MODELS
        value: "gemma4:e4b,gemma3:1b,gemma3:4b,gemma4:e2b,gemma4:26b"
      - key: RNDPLZ_STATE_DIR
        value: /tmp/rndplz-public-state
